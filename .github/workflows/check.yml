name: Check

# Runs the checks on every branch, so a broken commit is caught before it reaches `main`
# rather than after.
#
# `main` used to be excluded here because the GitHub Pages deploy workflow ran the same
# `npm run check` as its gate, and running it twice would have burned double the minutes
# and reported one failure twice. That workflow was retired when the site moved to Vercel
# at the rename, so this one picked the job up: without it, `main` would have no check on
# GitHub at all — only Vercel's build, which reports in the Vercel dashboard rather than
# against the commit.
on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # The same command Vercel's build gate and CLAUDE.md use. Keep these three in step.
      - name: Check
        working-directory: app
        run: npm run check
