name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Builds the v2 app. `vite.config.ts` sets `base: './'`, so the output is
      # path-relative and works from the Pages subpath without further config.
      - name: Build
        working-directory: app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The built app only — never the repo root. Publishing `.` is what used to
      # serve the old single-file tool instead of this build (see tag `v1-final`).
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
